<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta · Prompt Serviços</title>
    
    <link rel="icon" type="image/png" href="icon1.png">
    
    <!-- Boxicons CDN -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="carta.css">
</head>
<body>
    <!-- Botão de alternar tema -->
    <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
        <i class='bx bx-moon'></i>
    </button>

    <main class="container">
        <div class="page-header">
            <div class="logo-area">
                <img src="logo1.png" alt="Prompt Serviços" class="logo-img" onerror="this.src='https://via.placeholder.com/100x100?text=Logo'">
            </div>
            <div class="header-actions">
                <button id="btn-voltar" class="back-btn" title="Voltar ao início">
                    <i class='bx bx-arrow-back'></i>
                </button>
            </div>
        </div>

        <!-- Barra de Ferramentas de Edição -->
        <div class="toolbar" id="toolbar">
            <!-- Formatação básica -->
            <button type="button" data-command="bold" id="btn-bold" title="Negrito">
                <i class='bx bx-bold'></i>
            </button>
            <button type="button" data-command="italic" id="btn-italic" title="Itálico">
                <i class='bx bx-italic'></i>
            </button>
            <button type="button" data-command="underline" id="btn-underline" title="Sublinhado">
                <i class='bx bx-underline'></i>
            </button>
            <span class="separator"></span>
            
            <!-- Alinhamento -->
            <button type="button" data-command="justifyLeft" id="btn-left" title="Alinhar à esquerda">
                <i class='bx bx-align-left'></i>
            </button>
            <button type="button" data-command="justifyCenter" id="btn-center" title="Centralizar">
                <i class='bx bx-align-middle'></i>
            </button>
            <button type="button" data-command="justifyRight" id="btn-right" title="Alinhar à direita">
                <i class='bx bx-align-right'></i>
            </button>
            <button type="button" data-command="justifyFull" id="btn-justify" title="Justificar">
                <i class='bx bx-align-justify'></i>
            </button>
            <span class="separator"></span>
            
            <!-- Tamanho da fonte -->
            <div class="font-size-control">
                <button type="button" id="font-decrease" title="Diminuir fonte">
                    <i class='bx bx-minus'></i>
                </button>
                <span id="font-size-indicator" class="font-indicator">16</span>
                <button type="button" id="font-increase" title="Aumentar fonte">
                    <i class='bx bx-plus'></i>
                </button>
            </div>
            <span class="separator"></span>
            
            <!-- Cores - Grid de cores -->
            <div class="color-picker-grid">
                <button type="button" class="color-btn" data-color="#000000" style="background: #000000;" title="Preto"></button>
                <button type="button" class="color-btn" data-color="#c10404" style="background: #c10404;" title="Vermelho Prompt"></button>
                <button type="button" class="color-btn" data-color="#ff0000" style="background: #ff0000;" title="Vermelho claro"></button>
                <button type="button" class="color-btn" data-color="#0066cc" style="background: #0066cc;" title="Azul"></button>
                <button type="button" class="color-btn" data-color="#00aaff" style="background: #00aaff;" title="Azul claro"></button>
                <button type="button" class="color-btn" data-color="#008800" style="background: #008800;" title="Verde escuro"></button>
                <button type="button" class="color-btn" data-color="#00cc00" style="background: #00cc00;" title="Verde"></button>
                <button type="button" class="color-btn" data-color="#ff6600" style="background: #ff6600;" title="Laranja"></button>
                <button type="button" class="color-btn" data-color="#ffcc00" style="background: #ffcc00;" title="Amarelo"></button>
                <button type="button" class="color-btn" data-color="#993399" style="background: #993399;" title="Roxo"></button>
                <button type="button" class="color-btn" data-color="#ff69b4" style="background: #ff69b4;" title="Rosa"></button>
                <button type="button" class="color-btn" data-color="#ffffff" style="background: #ffffff; border:1px solid #ccc;" title="Branco"></button>
            </div>
            <span class="separator"></span>
            
            <!-- Listas -->
            <button type="button" data-command="insertUnorderedList" id="btn-ul" title="Lista com marcadores">
                <i class='bx bx-list-ul'></i>
            </button>
            <button type="button" data-command="insertOrderedList" id="btn-ol" title="Lista numerada">
                <i class='bx bx-list-ol'></i>
            </button>
            <span class="separator"></span>
            
            <!-- Limpar formatação -->
            <button type="button" id="clearFormatting" title="Limpar formatação">
                <i class='bx bx-eraser'></i>
            </button>
        </div>

        <!-- Área da carta que será capturada -->
        <div id="carta-para-imagem" class="carta-wrapper">
            <div class="carta-conteudo" id="carta-conteudo">
                <div class="carta-header">
                    <img src="logo1.png" alt="Prompt Serviços" class="carta-logo" onerror="this.src='https://via.placeholder.com/150x80?text=Logo'">
                    <p class="slogan">Soluções em mão de obra</p>
                </div>
                
                <div class="carta-corpo" id="carta-corpo-editable" contenteditable="true" data-placeholder="Escreva aqui o conteúdo da sua carta..."></div>
                
                <div class="carta-assinatura" id="assinatura-area">
                    <div class="assinatura-linha" id="assinatura-nome">_________________________</div>
                    <div class="assinatura-linha" id="assinatura-email">_________________________</div>
                    <div class="assinatura-linha" id="assinatura-telefone">_________________________</div>
                </div>
            </div>
        </div>

        <!-- Campos editáveis -->
        <div class="campos-editor">
            <h3><i class='bx bx-edit-alt'></i> Dados da Carta</h3>
            <div class="campo-row" id="campo-nome-carta" style="display: none;">
                <div class="campo-group" style="width: 100%;">
                    <label><i class='bx bx-tag'></i> Nome da Carta *</label>
                    <input type="text" id="input-nome-carta" class="input-moderno" placeholder="Ex: Carta de Apresentação - Cliente XYZ">
                </div>
            </div>
            <div class="campo-row">
                <div class="campo-group">
                    <label><i class='bx bxs-user'></i> Nome</label>
                    <input type="text" id="input-nome" class="input-moderno" placeholder="Digite seu nome">
                </div>
                <div class="campo-group">
                    <label><i class='bx bxs-envelope'></i> E-mail</label>
                    <input type="email" id="input-email" class="input-moderno" placeholder="seu@email.com">
                </div>
                <div class="campo-group">
                    <label><i class='bx bxs-phone'></i> Telefone</label>
                    <input type="text" id="input-telefone" class="input-moderno" placeholder="(00) 00000-0000">
                </div>
            </div>
        </div>

        <!-- Botões de ação -->
        <div class="action-buttons">
            <button id="btn-salvar" class="btn-acao">
                <i class='bx bx-save'></i> Salvar Carta
            </button>
            <button id="btn-compartilhar" class="btn-acao">
                <i class='bx bx-camera'></i> Compartilhar
            </button>
        </div>
    </main>

    <!-- Modal de mensagem -->
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <i class='bx bx-check-circle modal-icon' id="modal-icon"></i>
            <p class="modal-text" id="modal-mensagem">Operação realizada com sucesso!</p>
            <button class="modal-btn-ok" id="modal-ok">Entendi</button>
        </div>
    </div>

    <!-- Modal para nome da carta -->
    <div id="modal-nome-carta" class="modal">
        <div class="modal-content">
            <i class='bx bx-tag modal-icon'></i>
            <p class="modal-text">Digite um nome para a carta:</p>
            <input type="text" id="modal-nome-input" class="input-moderno" placeholder="Ex: Carta de Apresentação - Cliente XYZ">
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancelar" id="modal-cancelar-nome">Cancelar</button>
                <button class="modal-btn modal-btn-salvar-nome" id="modal-salvar-nome">Salvar</button>
            </div>
        </div>
    </div>

    <script src="carta.js"></script>
</body>
</html>
