<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Serviços · Gestão de Propostas</title>
    
    <link rel="icon" type="image/png" href="icon1.png">
    
    <!-- Boxicons CDN -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <!-- Botão de alternar tema -->
    <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
        <i class='bx bx-moon'></i>
    </button>

    <main class="container">
        <div class="header">
            <div class="header-left">
                <i class='bx bx-line-chart header-icon'></i>
                <h1>Prompt Serviços</h1>
            </div>
            <div class="user-info">
                <i class='bx bxs-user-circle'></i>
                <span id="usuario-nome">Carregando...</span>
                <button id="btn-logout" class="logout-btn" title="Sair">
                    <i class='bx bx-log-out'></i>
                </button>
            </div>
        </div>
        
        <p class="subtitle">Gestão de propostas</p>

        <div class="toggle-container">
            <button class="toggle-btn" id="btn-criar">
                <i class='bx bx-plus-circle'></i>
                <span>Criar proposta</span>
            </button>
            <button class="toggle-btn" id="btn-ver">
                <i class='bx bx-show'></i>
                <span>Ver propostas</span>
            </button>
        </div>

        <!-- Painel Criar Proposta -->
        <div id="criar-panel" class="panel hidden">
            <div class="field">
                <label><i class='bx bx-file'></i> Tipo de documento</label>
                <div class="custom-select-wrapper">
                    <div class="custom-select" id="custom-select">
                        <div class="custom-select-trigger">
                            <span class="custom-select-value">Selecione o tipo</span>
                            <i class='bx bx-chevron-down'></i>
                        </div>
                        <div class="custom-select-options">
                            <div class="custom-option" data-value="efetivo">
                                <i class='bx bxs-user-badge'></i> Efetivo
                            </div>
                            <div class="custom-option" data-value="temporario">
                                <i class='bx bx-time'></i> Temporário
                            </div>
                            <div class="custom-option" data-value="terceirizado">
                                <i class='bx bxs-building'></i> Terceirizado
                            </div>
                            <div class="custom-option" data-value="carta">
                                <i class='bx bxs-envelope'></i> Carta
                            </div>
                        </div>
                    </div>
                    <select id="contrato-criar" style="display: none;">
                        <option value="" disabled selected></option>
                        <option value="efetivo">Efetivo</option>
                        <option value="temporario">Temporário</option>
                        <option value="terceirizado">Terceirizado</option>
                        <option value="carta">Carta</option>
                    </select>
                </div>
            </div>
            <button class="btn-primary" id="btn-continuar">
                <span>Continuar</span>
                <i class='bx bx-right-arrow-alt'></i>
            </button>
        </div>

        <!-- Painel Ver Propostas -->
        <div id="ver-panel" class="panel hidden">
            <div class="filtros">
                <div class="filtro-item">
                    <label><i class='bx bxs-building'></i> Cliente</label>
                    <input type="text" id="filtro-cliente" class="input-moderno" placeholder="Nome do cliente">
                </div>
                <div class="filtro-item" id="filtro-vendedor-container">
                    <label><i class='bx bxs-user-detail'></i> Vendedor</label>
                    <div class="select-wrapper">
                        <select id="filtro-vendedor">
                            <option value="">Todos</option>
                        </select>
                        <i class='bx bx-chevron-down select-arrow-icon'></i>
                    </div>
                </div>
                <div class="filtro-item" id="filtro-tipo-container">
                    <label><i class='bx bx-tag'></i> Tipo</label>
                    <div class="select-wrapper">
                        <select id="filtro-tipo">
                            <option value="">Todos</option>
                            <option value="efetivo">Efetivo</option>
                            <option value="temporario">Temporário</option>
                            <option value="terceirizado">Terceirizado</option>
                            <option value="carta">Carta</option>
                        </select>
                        <i class='bx bx-chevron-down select-arrow-icon'></i>
                    </div>
                </div>
                <div class="filtro-item data-group">
                    <div class="data-field">
                        <label><i class='bx bx-calendar'></i> Início</label>
                        <input type="date" id="filtro-data-inicio" class="input-moderno">
                    </div>
                    <div class="data-field">
                        <label><i class='bx bx-calendar'></i> Fim</label>
                        <input type="date" id="filtro-data-fim" class="input-moderno">
                    </div>
                </div>
            </div>
            <div id="cards-container" class="cards-container">
                <div class="loading-state">
                    <i class='bx bx-loader-alt bx-spin'></i>
                    <p>Carregando propostas...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de confirmação -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <i class='bx bx-folder-open modal-icon'></i>
            <h3>Abrir proposta?</h3>
            <p>Tem certeza que deseja abrir esta proposta?</p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-confirm">Sim, abrir</button>
                <button class="modal-btn modal-btn-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal de exclusão -->
    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <i class='bx bx-trash modal-icon' style="color: #ff4444;"></i>
            <h3>Excluir proposta?</h3>
            <p>Esta ação não pode ser desfeita. Tem certeza?</p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-delete">Sim, excluir</button>
                <button class="modal-btn modal-btn-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="menu.js"></script>
</body>
</html>
