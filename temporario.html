<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt · Proposta Temporário</title>
    
    <link rel="icon" type="image/png" href="icon1.png">
    
    <!-- Boxicons CDN -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <link rel="stylesheet" href="temporario.css">
    
    <style>
        /* 🔥 CORREÇÃO FINAL - Campo de percentual de insalubridade */
        .ins-percentual-input {
            display: inline-block !important;
            width: 65px !important;
            min-width: 65px !important;
            max-width: 65px !important;
            height: 34px !important;
            padding: 0.2rem 0.4rem !important;
            background: #ffffff !important;
            border: 2px solid #c10404 !important;
            border-radius: 20px !important;
            color: #1e2a3e !important;
            font-weight: 700 !important;
            font-size: 1rem !important;
            text-align: center !important;
            outline: none !important;
            font-family: "Poppins", sans-serif !important;
            box-shadow: 0 0 0 1px rgba(193, 4, 4, 0.1) !important;
            flex-shrink: 0 !important;
            line-height: 1.4 !important;
            box-sizing: border-box !important;
            -webkit-text-fill-color: #1e2a3e !important;
            -webkit-appearance: none !important;
            appearance: none !important;
            margin: 0 !important;
        }

        .ins-percentual-input:focus {
            border-color: #c10404 !important;
            box-shadow: 0 0 0 4px rgba(193, 4, 4, 0.25) !important;
            background: #ffffff !important;
        }

        .ins-percentual-input::-webkit-inner-spin-button,
        .ins-percentual-input::-webkit-outer-spin-button {
            -webkit-appearance: none !important;
            margin: 0 !important;
        }

        .ins-percentual-wrapper {
            display: inline-flex !important;
            align-items: center !important;
            gap: 0.4rem !important;
            background: #f5f5f5 !important;
            border: 1px solid #d0d0d0 !important;
            border-radius: 24px !important;
            padding: 0.1rem 0.8rem !important;
            margin-left: 0.3rem !important;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            min-width: 85px !important;
        }

        .ins-percentual-wrapper:hover {
            border-color: #c10404 !important;
            box-shadow: 0 0 0 2px rgba(193, 4, 4, 0.1) !important;
        }

        .ins-percentual-label {
            font-weight: 700 !important;
            color: #1e2a3e !important;
            font-size: 0.85rem !important;
            user-select: none;
            min-width: 18px !important;
        }

        /* 🔥 TEMA ESCURO - CORES FORÇADAS */
        body.dark .ins-percentual-input {
            background: #2a2a2a !important;
            border-color: #ff6b6b !important;
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            box-shadow: 0 0 0 1px rgba(255, 107, 107, 0.2) !important;
        }

        body.dark .ins-percentual-input:focus {
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.3) !important;
            background: #333333 !important;
        }

        body.dark .ins-percentual-wrapper {
            background: #1a1a1a !important;
            border-color: #3a3a3a !important;
        }

        body.dark .ins-percentual-wrapper:hover {
            border-color: #ff6b6b !important;
            box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.15) !important;
        }

        body.dark .ins-percentual-label {
            color: #eef2ff !important;
        }

        /* 🔥 TEMA CLARO - CORES FORÇADAS */
        body:not(.dark) .ins-percentual-input {
            background: #ffffff !important;
            border-color: #c10404 !important;
            color: #1e2a3e !important;
            -webkit-text-fill-color: #1e2a3e !important;
            box-shadow: 0 0 0 1px rgba(193, 4, 4, 0.1) !important;
        }

        body:not(.dark) .ins-percentual-input:focus {
            box-shadow: 0 0 0 4px rgba(193, 4, 4, 0.2) !important;
            background: #ffffff !important;
        }

        body:not(.dark) .ins-percentual-wrapper {
            background: #f5f5f5 !important;
            border-color: #d0d0d0 !important;
        }

        body:not(.dark) .ins-percentual-wrapper:hover {
            border-color: #c10404 !important;
            box-shadow: 0 0 0 2px rgba(193, 4, 4, 0.1) !important;
        }

        body:not(.dark) .ins-percentual-label {
            color: #1e2a3e !important;
        }
    </style>
</head>
<body>
    <!-- Botão de alternar tema -->
    <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
        <i class='bx bx-moon'></i>
    </button>

    <main class="container">
        <div class="header">
            <div class="header-left">
                <i class='bx bx-time header-icon'></i>
                <h1>Prompt Serviços</h1>
            </div>
            <div class="header-actions">
                <button id="btn-voltar" class="back-btn" title="Voltar ao início">
                    <i class='bx bx-arrow-back'></i>
                </button>
            </div>
        </div>

        <div class="vendedor-info">
            <i class='bx bxs-user-tie'></i>
            <span id="vendedor-nome">Carregando...</span>
        </div>

        <p class="subtitle">
            <i class='bx bx-file-signature'></i> 
            Proposta de contrato temporário
        </p>

        <!-- Campo Cliente -->
        <div class="field cliente-field">
            <label><i class='bx bxs-building'></i> Cliente</label>
            <input type="text" id="cliente-nome" class="input-moderno" placeholder="NOME DO CLIENTE" style="text-transform: uppercase;">
        </div>

        <!-- Container dos cargos -->
        <div id="cargos-container"></div>

        <!-- Botão adicionar cargo -->
        <button type="button" id="adicionar-cargo" class="btn-add">
            <i class='bx bx-plus-circle'></i> Adicionar cargo
        </button>

        <!-- Resumo final -->
        <div class="resumo-final">
            <div class="resumo-item">
                <i class='bx bx-chart'></i>
                <span>Total da proposta:</span>
                <strong id="total-geral">R$ 0,00</strong>
            </div>
        </div>

        <!-- Botões de ação -->
        <div class="action-buttons">
            <button type="button" class="btn-primary" id="btn-baixar-imagens">
                <i class='bx bx-download'></i> Baixar Imagens
            </button>
            <button type="button" class="btn-primary" id="btn-compartilhar-link">
                <i class='bx bx-share-alt'></i> Compartilhar Link
            </button>
            <button type="button" class="btn-primary" id="btn-salvar">
                <i class='bx bx-save'></i> Salvar proposta
            </button>
        </div>
    </main>

    <!-- Modal de compartilhamento -->
    <div id="modal-share" class="modal">
        <div class="modal-content">
            <i class='bx bx-link-alt modal-icon'></i>
            <h3>Link para visualização</h3>
            <p class="modal-text">Compartilhe este link para visualizar a proposta</p>
            <div class="share-link-container">
                <input type="text" id="share-link" class="input-moderno" readonly>
                <button id="btn-copiar-link" class="btn-copy">
                    <i class='bx bx-copy'></i> Copiar
                </button>
            </div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-ok" id="modal-share-ok">Fechar</button>
            </div>
        </div>
    </div>

    <!-- Modal de confirmação -->
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <i class='bx bx-check-circle modal-icon' id="modal-icon"></i>
            <p class="modal-text" id="modal-mensagem">Operação realizada com sucesso!</p>
            <button class="modal-btn-ok" id="modal-ok">Entendi</button>
        </div>
    </div>

    <script src="temporario.js"></script>
</body>
</html>
