<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Prompt Serviços</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="icon" type="image/png" href="icon1.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
</head>
<body>
    <!-- Botão de tema flutuante -->
    <button id="btn-tema" class="btn-tema-flutuante" title="Modo claro/escuro">
        <i class="fas fa-moon"></i>
    </button>

    <div class="container">
        <div class="login-box">
            <div class="logo-container">
                <img src="logo.png" alt="Prompt Serviços" class="logo">
            </div>
            
            <h1 class="welcome-title">Bem-vindo</h1>
            <p class="welcome-subtitle">Acesse nosso canal de propostas</p>

            <form id="login-form">
                <div class="input-group">
                    <div class="input-field">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="email" name="email" placeholder="E-mail" autocomplete="email" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-field">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Senha" autocomplete="current-password" required>
                        <button type="button" class="toggle-password" id="toggle-password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Lembrar-me</span>
                    </label>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span>Entrar</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Modal de erro/mensagem -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal-content">
            <i class="fas fa-exclamation-circle modal-icon"></i>
            <p class="modal-text" id="modal-mensagem">Erro ao fazer login</p>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-ok" id="modal-ok">Entendi</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
