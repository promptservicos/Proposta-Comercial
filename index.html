<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Serviços · Login</title>
    
    <link rel="icon" type="image/png" href="icon1.png">
    
    <!-- Boxicons CDN -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS principal -->
    <link rel="stylesheet" href="index.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Botão de alternar tema -->
    <button id="themeToggle" class="theme-toggle" aria-label="Alternar tema">
        <i class='bx bx-moon'></i>
    </button>

    <main class="container">
        <form id="loginForm">
            <div class="logo-container">
                <img src="logo.png" alt="Prompt Serviços" class="logo">
            </div>
            
            <p class="subtitle">Acesse nosso canal de propostas</p>
            
            <div id="alertBox"></div>

            <div class="input-box">
                <label for="email" class="sr-only">E-mail</label>
                <i class='bx bxs-envelope input-icon-left'></i>
                <input id="email" placeholder="E-mail corporativo" type="email" required autocomplete="email">
            </div>

            <div class="input-box">
                <label for="senha" class="sr-only">Senha</label>
                <i class='bx bxs-lock-alt input-icon-left'></i>
                <input id="senha" placeholder="Senha" type="password" required autocomplete="current-password">
                <button type="button" class="toggle-password" id="togglePassword">
                    <i class='bx bx-show'></i>
                </button>
            </div>

            <div class="remember-forgot">
                <label class="custom-checkbox">
                    <input type="checkbox" id="rememberMe">
                    <span class="checkmark"></span>
                    <span class="checkbox-text">Lembrar</span>
                </label>
                <a href="#" id="forgotPasswordLink">Esqueci minha senha</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span>Entrar</span>
                <i class='bx bx-log-in'></i>
            </button>

            <div class="support-link">
                <p>Problemas para acessar? <a href="#" id="supportLink" class="support-link-highlight">Contate o suporte</a></p>
            </div>
        </form>
    </main>

    <!-- Modal para recuperação de senha -->
    <div id="passwordResetModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <i class='bx bx-mail-send modal-icon'></i>
            <h2>Recuperar Senha</h2>
            <p>Informe seu e-mail corporativo para receber instruções de redefinição de senha.</p>
            <div class="input-box">
                <i class='bx bxs-envelope input-icon-left'></i>
                <input type="email" id="resetEmail" placeholder="Seu e-mail corporativo">
            </div>
            <button id="sendResetEmail" class="login-btn">Enviar instruções</button>
            <div id="resetAlertBox"></div>
        </div>
    </div>

    <!-- Modal de erro/mensagem -->
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <span class="close" id="closeMessageModal">&times;</span>
            <i class='bx bx-error-circle modal-icon' id="messageIcon"></i>
            <p id="messageText" class="modal-message"></p>
            <button id="messageOkBtn" class="login-btn">Entendi</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
